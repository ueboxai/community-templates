name: mirror

# main 上的清单或模板包变了之后，刷新 jsDelivr 镜像的缓存。
# jsDelivr 对分支地址会缓存很久，不刷新的话镜像上的清单和包可能新旧混杂，客户端会因 sha256 对不上而拒绝。
on:
  push:
    branches: [main]
    paths:
      - manifest.json
      - manifest.json.minisig
      - packages/**
      - thumbnails/**

permissions:
  contents: read

jobs:
  purge-jsdelivr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 刷新 jsDelivr 缓存
        run: |
          for f in manifest.json manifest.json.minisig packages/* thumbnails/*; do
            [ -f "$f" ] || continue
            if curl -fsS --retry 3 -o /dev/null "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/$f"; then
              echo "已刷新 $f"
            else
              echo "::warning::刷新 jsDelivr 缓存失败：$f"
            fi
          done
