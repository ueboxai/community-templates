; 渲染起步工程 —— 面向离线出片与可视化，不是游戏工程。
;
; 这里的取值全部对照 UE 5.7 自带的 TP_AEC_ArchvisBP 模板校对过，不是凭印象写的。
; 与「游戏启动工程」的区别集中在三处：
;   · 允许静态光照（渲染流程里烘焙 Lightmass 仍然是常规手段，游戏模板关掉了它）
;   · 打开路径追踪与硬件光追阴影，出片质量优先于帧率
;   · 默认关掉运动模糊/泛光这类会干扰成片判断的后期，交给用户在后期体积里显式开

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Maximum
AppliedDefaultGraphicsPerformance=Maximum

[/Script/Engine.RendererSettings]
; ---- 全局光照与反射：Lumen + 硬件光追 ----
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.HardwareRayTracing=True
r.Lumen.TraceMeshSDF=1
r.GenerateMeshDistanceFields=True

; ---- 光线追踪与路径追踪 ----
r.RayTracing=True
r.PathTracing=True
r.RayTracing.Shadows=True
r.RayTracing.UseTextureLod=True
r.RayTracing.Geometry.InstancedStaticMeshes.Culling=0

; ---- 阴影与材质 ----
r.Shadow.Virtual.Enable=1
r.Substrate=True
r.Substrate.ProjectGBufferFormat=1
r.MinRoughnessOverride=0.02

; ---- 质量 ----
; 渲染工程保留静态光照：Lumen 之外，烘焙仍然是可选路径
r.AllowStaticLighting=True
r.ReflectionCaptureResolution=2048
r.VirtualTextures=True
r.VirtualTexturedLightmaps=True
r.SkinCache.CompileShaders=True
; 高分辨率截图前多等几帧，避免抓到还没收敛的画面
r.HighResScreenshotDelay=8
r.DefaultBackBufferPixelFormat=4
r.AllowGlobalClipPlane=False

; ---- 曝光与色调 ----
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.Tonemapper.Sharpen=2
r.DefaultFeature.LensFlare=True
r.SupportSkyAtmosphereAffectsHeightFog=True
r.ClearCoatNormal=False
r.NormalMapsForStaticLighting=False
r.LightPropagationVolume=0

; ---- 后期 ----
; 运动模糊和泛光默认关掉，避免干扰对成片的判断；需要时在后期处理体积里显式打开
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.Bloom=False

[/Script/EngineSettings.GameMapsSettings]
; 模板本身不带关卡，用引擎自带的基础场景起步，用户建好工程立刻有个能看的环境
EditorStartupMap=/Engine/Maps/Templates/Template_Default
GameDefaultMap=/Engine/Maps/Templates/Template_Default

